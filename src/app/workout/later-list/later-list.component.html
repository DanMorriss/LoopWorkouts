<!-- Only while there's something skipped to do later (RUN-16) -->
@let items = this.items();
@if (items.length) {
    <div class="later">
        <button
            #button
            type="button"
            class="btn-icon later__button"
            aria-controls="later-menu"
            [attr.aria-label]="label()"
            [attr.aria-expanded]="open()"
            (click)="toggle()"
        >
            <mat-icon aria-hidden="true">fitness_center</mat-icon>
            @if (items.length > 1) {
                <span class="later__count" aria-hidden="true">{{ items.length }}</span>
            }
        </button>

        @if (open()) {
            <div
                id="later-menu"
                class="menu later__menu"
                role="group"
                aria-labelledby="later-heading"
                animate.leave="menu--leaving"
            >
                @if (items.length === 1) {
                    @let only = items[0];
                    <p id="later-heading" class="later__heading">Do {{ only.name }} next?</p>
                    <p class="later__detail">{{ only.detail }}</p>
                    <div class="later__actions">
                        <button type="button" class="btn-pill" (click)="close()">Not now</button>
                        <button
                            type="button"
                            class="btn-pill later__yes"
                            (click)="doNext(only.later, only.name)"
                        >
                            Do it next
                        </button>
                    </div>
                } @else {
                    <p id="later-heading" class="later__heading">Skipped · do one next</p>
                    @for (item of items; track item.key) {
                        <button
                            type="button"
                            appLaterOption
                            [name]="item.name"
                            [detail]="item.detail"
                            (click)="doNext(item.later, item.name)"
                        ></button>
                    }
                }
            </div>
        }
    </div>
}
