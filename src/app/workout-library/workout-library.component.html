<div class="library-screen p-4 text-(--text-strong)" (click)="closeWorkoutMenus()">
    <!-- The title, as on the other pages, with the way to make a workout at its right -->
    <div class="library__top">
        <h2 class="library__title">Workouts</h2>
        <button
            type="button"
            class="btn-main btn-main--small library-add-button"
            aria-label="New workout"
            (click)="$event.stopPropagation(); navigateToCreateWorkout()"
        >
            <mat-icon aria-hidden="true">add</mat-icon>
            New
        </button>
    </div>

    @if (!hasOwn()) {
        <p class="library__intro">Start any of these, or make your own with New.</p>
    }

    <app-library-filters class="library__filters" (click)="$event.stopPropagation()" />
    @if (filters.shownCount(); as count) {
        <div class="library__count">
            <p role="status">{{ count }}</p>
            @if (filters.active()) {
                <button
                    type="button"
                    class="library__clear"
                    (click)="$event.stopPropagation(); filters.clear()"
                >
                    Clear search and filters
                </button>
            }
        </div>
    }

    <!-- Yours and the ready-made ones, A to Z. A ready-made one can't be changed or
         deleted, but copied to make one of your own -->
    <ul class="library-list">
        @for (workout of filters.shown(); track workout.id) {
            <li
                appWorkoutCard
                [attr.data-workout]="workout.id"
                [workout]="workout"
                [menuOpen]="openWorkoutMenuId() === workout.id"
                [highlighted]="highlightedId() === workout.id"
                (started)="startWorkout(workout)"
                (menuToggled)="toggleWorkoutMenu(workout.id)"
                (menuClosed)="closeWorkoutMenu(workout.id)"
                (editRequested)="navigateToEditWorkout(workout)"
                (copyRequested)="copyWorkout(workout)"
                (deleteRequested)="deleteWorkout(workout)"
            ></li>
        }
    </ul>
    <div class="sr-only" aria-live="polite">{{ announcement() }}</div>
</div>
