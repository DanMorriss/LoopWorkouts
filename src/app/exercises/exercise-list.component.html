<!-- Opened from another page's muscle, ‹ and a swipe right go back there -->
<div class="flex justify-center" [appSwipeBack]="back?.url ?? ''" [swipeBackDisabled]="!back">
    <div class="w-full max-w-md p-4">
        @if (back; as back) {
            <app-back-link [url]="back.url" [label]="back.label" />
        }
        <div class="exercises__top">
            <h2 class="exercises__title">Exercises</h2>
            <button
                type="button"
                id="exercise-list-new"
                class="btn-main btn-main--small"
                aria-label="New exercise"
                (click)="drafting.set(true)"
            >
                <mat-icon aria-hidden="true">add</mat-icon>
                New
            </button>
        </div>

        <app-search-field class="exercises__search" inputId="exercise-search" [(value)]="query" />

        <app-equipment-filter class="exercises__kit" idPrefix="exercise-list" things="Exercises" />

        <app-muscle-chips
            class="exercises__chips"
            [selected]="selectedMuscles()"
            (selectedChange)="setMuscles($event)"
        />

        <section class="exercises__map" aria-label="Pick muscles on body map">
            <app-body-map
                [main]="selectedMuscles()"
                [tappable]="true"
                [toggles]="true"
                [removableLabels]="true"
                (muscleTapped)="pickMuscle($event)"
                (muscleCleared)="pickMuscle($event)"
            />
        </section>

        <app-exercise-cards [cards]="shown()" [clearable]="filtered()" (cleared)="clearFilters()" />

        @if (hidden().length > 0) {
            <button
                type="button"
                class="exercises__hidden-toggle"
                aria-controls="exercise-list-hidden"
                [attr.aria-expanded]="hiddenOpen()"
                (click)="hiddenOpen.set(!hiddenOpen())"
            >
                Hidden from the picker ({{ hidden().length }})
                <mat-icon aria-hidden="true">{{
                    hiddenOpen() ? 'expand_less' : 'expand_more'
                }}</mat-icon>
            </button>
            @if (hiddenOpen()) {
                <app-exercise-cards
                    listId="exercise-list-hidden"
                    [cards]="hidden()"
                    [counted]="false"
                />
            }
        }
    </div>
</div>

@if (drafting()) {
    <app-exercise-editor
        animate.leave="dialog-leave"
        [exercise]="draft"
        [isNew]="true"
        (closed)="closeDraft()"
        (saved)="made($event)"
    />
}
