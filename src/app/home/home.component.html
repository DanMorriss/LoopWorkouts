<div class="flex justify-center">
    <div class="home w-full max-w-md p-4">
        <h2 class="home__greeting" id="home-title" tabindex="-1">{{ greeting() }}</h2>

        <!-- Until it's taken or turned down on this device, the tour of the app (NAV-8) -->
        <app-tour-offer class="home__card" />

        @if (hasWorkouts() || hasPlan()) {
            <!-- The week's plan (PLN-4), the way in to changing it, with what's on the day
                 picked under it, today's to start (PLN-2); with nothing planned, a nudge to
                 plan it (NAV-6) -->
            <app-week-strip class="home__card" data-tour="week" />
        } @else {
            <!-- New, with none of your own and nothing planned: a week to start with (NAV-6) -->
            <app-get-started class="home__card" data-tour="get-started" />
        }
        <!-- With a week planned, the plan says what's next, but a day with nothing planned
             offers a workout that leaves the next one's muscles fresh; with no plan, the
             suggestions are for what's least worked. After training today, stretches for it
             come first, planned day or not, once nothing planned is left to do -->
        <app-suggested-workout
            class="home__card"
            [restDay]="restDay()"
            [suggestWorkouts]="restDay() || (hasHistory() && !hasPlan())"
            [stretchToday]="!trainingLeftToday()"
        />
        <!-- The muscles worked in the last 7 days, on the body map; with nothing done in them
             it shows nothing, as a blank map would only look like a telling off -->
        <app-muscles-this-week class="home__card" [compact]="true" />
    </div>
</div>
