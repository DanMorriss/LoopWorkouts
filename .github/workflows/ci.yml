# Checks every pull request (and every push to main): formatting, component size, unused code,
# unit tests (including the axe accessibility checks) and the production build, whose budgets
# and compiler options fail it too; and, alongside, the end-to-end tests (e2e/).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check component size
        run: npm run lint

      - name: Check for unused code
        run: npm run unused

      # The tests run in a real browser (Vitest browser mode with Playwright)
      - name: Install Chromium for the tests
        run: npx playwright install --with-deps chromium

      - name: Unit and accessibility tests
        run: npx ng test --watch=false --no-progress

      - name: Production build
        run: npm run build

  # The pack takes about 18 minutes on one 2-core runner, so it's split into 3 shards that run
  # side by side, each a third of the tests on 2 workers (playwright.config.ts)
  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the app for production and serves it (playwright.config.ts), then runs e2e/
      - name: End-to-end tests
        run: npm run e2e -- --shard=${{ matrix.shard }}/3

      # The HTML report, with each failed test's trace, screenshot and video: download it from
      # the run's summary and open it with `npx playwright show-report <folder>`
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
