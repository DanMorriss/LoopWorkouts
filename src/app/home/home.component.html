<div class="flex justify-center">
    <div class="home w-full max-w-md p-4">
        <h2 class="home__greeting">{{ greeting() }}</h2>

        @if (hasWorkouts() || hasPlan()) {
            <!-- The week's plan (PLN-4), the way in to changing it; with nothing planned, a
                 nudge to plan it (NAV-6) -->
            <app-week-strip class="home__card" />
        } @else {
            <!-- New, with none of your own and nothing planned: a week to start with (NAV-6) -->
            <app-get-started class="home__card" />
        }
        <!-- The weekly plan's workouts for today (PLN-2) -->
        <app-due-today class="home__card" />
        <!-- With a week planned, the plan says what's next, but a day with nothing planned
             offers a workout that leaves the next one's muscles fresh; with no plan, the
             suggestion is for what's least worked -->
        @if (restDay()) {
            <app-suggested-workout class="home__card" [restDay]="true" />
        } @else if (hasHistory() && !hasPlan()) {
            <app-suggested-workout class="home__card" />
        }
    </div>
</div>
