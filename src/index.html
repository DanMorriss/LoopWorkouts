<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Loop Workouts</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- What search results and shared links show: the words, and public/share.png (made by
             tools/build-share-image.mjs). The copy's other versions are in docs/marketing.md. -->
        <meta
            name="description"
            content="A workout timer for kettlebells and circuits that remembers what you lifted: reps, rests and rounds, run for you, and what to beat next time. Free in beta."
        />
        <link rel="canonical" href="https://loopworkouts.com/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Loop Workouts" />
        <meta property="og:url" content="https://loopworkouts.com/" />
        <meta
            property="og:title"
            content="Loop Workouts: the workout timer that remembers what you lifted"
        />
        <meta
            property="og:description"
            content="Runs your kettlebell or circuit workout, reps and rests included, and shows you what to beat next time. Free while in beta."
        />
        <meta property="og:image" content="https://loopworkouts.com/share.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Loop Workouts on a phone, mid-workout: a kettlebell halo, 8 reps, waiting for Done"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <!-- The ∞ and its light on the Start button's cyan. Firefox moves the light round the
             loop; other browsers show it still. The .ico is for browsers without SVG icons. -->
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <!-- Added to the Home Screen, it opens on its own like an app, not in a browser tab -->
        <link rel="manifest" href="manifest.webmanifest" />
        <!-- The browser's bars in the page colour (--page-bg), dark until the script says -->
        <meta name="theme-color" content="#070b12" />
        <script>
            // Apply the saved theme before anything draws, so a light theme doesn't flash dark
            // first. ThemeService takes over once the app has loaded.
            try {
                var theme = JSON.parse(localStorage.getItem('settings') || '{}').theme;
                if (theme === 'system') {
                    theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
                if (theme === 'light') {
                    // --page-bg in the light theme
                    document.querySelector('meta[name="theme-color"]').content = '#eef3f9';
                }
            } catch (e) {
                // Unreadable settings: stay on the default dark theme
            }
            // An empty touchstart listener makes iPhones show :active styles while a finger is
            // down: Safari skips them on pages that listen for no touches. Here rather than an
            // ontouchstart attribute, which the Content-Security-Policy blocks.
            document.addEventListener('touchstart', function () {}, { passive: true });
        </script>
        <!-- The two fonts every page needs, from the app's own address (styles/_fonts.scss),
             fetched straight away rather than once the stylesheet's read -->
        <link
            rel="preload"
            href="/fonts/material-symbols-outlined.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/audiowide-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
    </head>
    <body class="mat-typography">
        <app-root></app-root>
    </body>
</html>
