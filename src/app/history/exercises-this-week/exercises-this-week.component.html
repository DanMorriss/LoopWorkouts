@if (rows().length) {
    <section class="exercises-week" aria-labelledby="exercises-week-title">
        <h3 class="exercises-week__title" id="exercises-week-title">Exercises this week</h3>
        @if (bests().length) {
            <app-new-best-tiles class="exercises-week__bests" [bests]="bests()" />
        }
        <div class="exercises-week__head" aria-hidden="true">
            <span>All exercises</span>
            <span>Sets</span>
        </div>
        <ul class="exercises-week__list">
            @for (row of shown(); track row.id) {
                <li class="exercises-week__item">
                    <a
                        class="exercises-week__row"
                        [id]="'week-' + row.slug"
                        [routerLink]="row.path"
                        [queryParams]="{ from: 'progress' }"
                    >
                        <span class="exercises-week__name">{{ row.name }}</span>
                        <span
                            class="exercises-week__pips"
                            aria-hidden="true"
                            [style.--sets]="row.sets"
                        >
                            @for (pip of row.pips; track $index) {
                                <span
                                    class="exercises-week__pip"
                                    [class.exercises-week__pip--timed]="pip === 'timed'"
                                ></span>
                            }
                        </span>
                        <span class="exercises-week__total" aria-hidden="true">{{ row.text }}</span>
                        <span class="sr-only">, {{ row.spoken }}</span>
                        <app-icon class="exercises-week__chevron">chevron_right</app-icon>
                    </a>
                </li>
            }
        </ul>
        @if (rows().length > shownCount) {
            <button type="button" class="exercises-week__toggle" (click)="showAll.set(!showAll())">
                {{ showAll() ? 'Show fewer' : 'Show all ' + rows().length }}
            </button>
        }
    </section>
}
