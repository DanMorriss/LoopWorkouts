<div class="flex justify-center" [appSwipeBack]="back.url">
    <div class="w-full max-w-md p-4">
        <app-back-link [url]="back.url" [label]="back.label" />

        @if (card(); as card) {
            @let workout = card.workout;
            <h2 class="preview__title">{{ workout.title }}</h2>
            <p class="preview__description">{{ workout.description }}</p>
            <ul class="preview__chips" aria-label="Equipment">
                @for (need of card.equipment; track need) {
                    <li class="preview__chip">{{ need }}</li>
                }
            </ul>

            <section class="preview__section" aria-labelledby="ready-made-steps">
                <h3 id="ready-made-steps" class="preview__heading">What's in it</h3>
                <app-workout-outline [workout]="workout" [exerciseUrl]="exerciseUrl" />
            </section>

            <section class="preview__section" aria-labelledby="ready-made-muscles">
                <h3 id="ready-made-muscles" class="preview__heading">Muscles it works</h3>
                <app-body-map [main]="muscles().main" [supporting]="muscles().supporting" />
            </section>
        } @else {
            <h2 class="preview__title">Workout not found</h2>
            <p class="preview__description">There's no ready-made workout at this link.</p>
        }
    </div>
</div>
