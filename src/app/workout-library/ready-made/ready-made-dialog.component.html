@let workout = card().workout;
<div
    class="preview-overlay dialog-overlay"
    role="presentation"
    (click)="closed.emit()"
    (keydown.escape)="closed.emit()"
>
    <div
        #dialogCard
        class="preview dialog-card"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="ready-made-title"
        aria-describedby="ready-made-description"
        (click)="$event.stopPropagation()"
    >
        <app-dialog-back label="Ready-made" (back)="closed.emit()" />
        <!-- Focus starts here, so it opens at the top rather than at the buttons below -->
        <h2 id="ready-made-title" class="preview__title" tabindex="-1" cdkFocusInitial>
            {{ workout.title }}
        </h2>
        <p id="ready-made-description" class="preview__description">{{ workout.description }}</p>
        <ul class="preview__chips" aria-label="Equipment">
            @for (need of card().equipment; track need) {
                <li class="preview__chip">{{ need }}</li>
            }
        </ul>
        @if (card().inLibrary) {
            <p class="preview__note">You have a workout called this in your workouts already.</p>
        }

        <section class="preview__section" aria-labelledby="ready-made-steps">
            <h3 id="ready-made-steps" class="preview__heading">What's in it</h3>
            <app-workout-outline [workout]="workout" />
        </section>

        <section class="preview__section" aria-labelledby="ready-made-muscles">
            <h3 id="ready-made-muscles" class="preview__heading">Muscles it works</h3>
            <app-body-map [main]="muscles().main" [supporting]="muscles().supporting" />
        </section>

        <div class="preview__actions">
            <button
                type="button"
                class="btn-main btn-main--small preview__start"
                (click)="started.emit()"
            >
                <mat-icon aria-hidden="true">play_arrow</mat-icon>
                Add and start
            </button>
            <button type="button" class="btn-pill preview__add" (click)="added.emit()">
                <mat-icon aria-hidden="true">add</mat-icon>
                Add to my workouts
            </button>
        </div>
    </div>
</div>
