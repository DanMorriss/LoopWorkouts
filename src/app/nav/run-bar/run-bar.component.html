@if (shown()) {
    <!-- Shows behind the bar as it's swiped right, to end the workout -->
    @if (!finished()) {
        <div class="run-bar__end" aria-hidden="true">
            <app-icon>stop</app-icon>
            End workout
        </div>
    }
    <aside
        #bar
        class="run-bar"
        aria-label="Workout in progress"
        [attr.data-phase]="phase()"
        (pointerdown)="swipe.press($event)"
        (pointermove)="swipe.move($event)"
        (pointerup)="swipe.release($event)"
        (pointercancel)="swipe.cancel()"
    >
        <!-- Grows into the workout page as it opens (WorkoutMorph) -->
        <a #open class="run-bar__open" href="/workout" (click)="morph.follow($event, '/workout')">
            @if (finished()) {
                <app-icon class="run-bar__done">check</app-icon>
            } @else {
                <span class="run-bar__dot" aria-hidden="true"></span>
            }
            <span class="run-bar__text">
                <span class="run-bar__step">{{ step() }}</span>
                <span class="run-bar__context">{{ context() }}</span>
            </span>
            @if (amount(); as amount) {
                <span class="run-bar__amount">
                    {{ amount.value }}
                    @if (amount.unit) {
                        <span class="run-bar__unit">{{ amount.unit }}</span>
                    }
                </span>
            }
        </a>
        @if (!finished()) {
            <button
                #action
                type="button"
                class="btn-icon run-bar__button"
                [attr.aria-label]="button().label"
                (click)="pressButton()"
            >
                <app-icon>{{ button().icon }}</app-icon>
            </button>
        }
        <!-- The workout page's announcements, while it isn't there to make them -->
        <span class="sr-only" aria-live="polite" aria-atomic="true">{{ announcement() }}</span>
    </aside>
}
