<!-- data-tour: what the tour of the page (RUN-13) lights up, on the host -->
<!-- Left of the big button: Pause on a rep step, where the big button is Done, and Later, the
     exercises skipped to do later (RUN-16), further out -->
<div class="workout-controls__left">
    @if (!view.summaryOpen()) {
        <app-later-list [nextCard]="nextCard()" (emptied)="emptied.emit()" />
    }
    @if (mode() === 'done') {
        <div class="workout-control">
            <button
                type="button"
                class="btn-icon workout-control__side"
                aria-label="Pause"
                (click)="paused.emit()"
            >
                <mat-icon aria-hidden="true">pause</mat-icon>
            </button>
            <span class="workout-control__caption" aria-hidden="true">Pause</span>
        </div>
    }
</div>
<div class="workout-control workout-control--main">
    <!-- The one thing to press now, the biggest button in reach: Done on a rep step, Start on
         a timed exercise waiting for it after a long rest (RUN-14), otherwise Pause. One button
         all along, so focus stays on it as it changes. -->
    <button
        #mainButton
        id="workout-pause"
        type="button"
        class="btn-main btn-main--round"
        aria-keyshortcuts="Space"
        [attr.aria-label]="name()"
        (click)="main.emit()"
    >
        <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
    </button>
    <span class="workout-control__caption" aria-hidden="true">{{ caption() }}</span>
    <!-- Shown where there's likely a keyboard; screen readers get aria-keyshortcuts -->
    <kbd class="workout-control__key" aria-hidden="true">Space</kbd>
</div>
<div class="workout-control workout-control--skip">
    <button
        type="button"
        class="btn-icon workout-control__side"
        [attr.aria-label]="view.isRestActive() ? 'Skip rest' : 'Skip step'"
        (click)="skipped.emit()"
    >
        <mat-icon aria-hidden="true">skip_next</mat-icon>
    </button>
    <span class="workout-control__caption" aria-hidden="true">Skip</span>
</div>
